<!doctype html>
<!-- YouTube refuses to play inside the TV app (it runs from file://, so YouTube gets no
     referrer). The TV's trailer popup loads this page instead, which embeds the trailer from a
     real web address. Usage: trailer.html?v=<YouTube video id> -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trailer</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; }
        iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <script>
        const id = new URLSearchParams(location.search).get('v') || '';
        if (/^[\w-]{6,20}$/.test(id)) {
            const frame = document.createElement('iframe');
            frame.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0';
            frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
            frame.allowFullscreen = true;
            frame.title = 'Trailer';
            document.body.appendChild(frame);
        }
    </script>
</body>
</html>
